<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>用户登录</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
            font-family: Arial;
        }

        .login {
            width: 380px;
            background: #fff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, .1);
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            height: 42px;
            margin-top: 15px;
            padding: 0 10px;
        }

        button {
            width: 100%;
            height: 42px;
            margin-top: 25px;
            background: #1677ff;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #4096ff;
        }

        .error {
            color: red;
            text-align: center;
            margin-top: 10px;
        }
    </style>

</head>
<body>

<div class="login">

    <h2>登录</h2>

    <form method="post" action="/auth/login">
        <input type="text" name="username" placeholder="用户名"/>
        <input type="password" name="password" placeholder="密码"/>
        <button type="submit">登录</button>
    </form>

</div>

</body>
</html>
