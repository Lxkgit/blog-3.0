<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>用户注册</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        .register {
            width: 380px;
            background: #fff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, .1);
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            height: 42px;
            margin-top: 15px;
            padding: 0 10px;
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #1677ff;
        }

        button {
            width: 100%;
            height: 42px;
            margin-top: 25px;
            background: #1677ff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #4096ff;
        }

        .login {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .login a {
            color: #1677ff;
            text-decoration: none;
        }

        .login a:hover {
            color: #4096ff;
        }

        /*
         * Toast
         */
        .toast {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            padding: 12px 24px;
            background: rgba(255, 77, 79, 0.9);
            color: #fff;
            border-radius: 6px;
            font-size: 14px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 9999;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

<div class="register">
    <h2>注册</h2>
    <form method="post" action="/auth/register">
        <input
                type="text"
                name="username"
                placeholder="用户名"
                autocomplete="username"
                required
        >
        <input
                type="password"
                name="password"
                placeholder="密码"
                autocomplete="new-password"
                required
        >
        <button type="submit">
            注册
        </button>
    </form>
    <div class="login">
        已有账号？
        <a href="/auth/login">
            返回登录
        </a>
    </div>
</div>
<!-- Toast -->
<div id="toast" class="toast"></div>


<script>

    /*
     * 获取 URL 参数
     */
    const params = new URLSearchParams(window.location.search);
    const error = params.get("error");

    /*
     * 显示 Toast
     */
    function showToast(message) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.classList.add("show");
        setTimeout(function () {
            toast.classList.remove("show");
        }, 3000);
    }

    /*
     * 注册失败
     */
    if (error === "register_failed") {
        showToast("注册失败，请检查用户名和密码");
    } else if (error === "user_exist") {
        showToast("用户名已存在");
    }

</script>

</body>

</html>
