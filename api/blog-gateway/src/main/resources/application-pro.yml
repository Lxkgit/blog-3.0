  data:
    redis:
      database: 0
      host: 172.18.0.6
      port: 6379
      password: ENC(o8ZdpLA+3lVokD4Xd5801OYjaJCXdtKIUqPbz8+fU8s=)
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://172.18.0.3:3306/blog_gateway?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowMultiQueries=true&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: root
    password: ENC(CHAMoyE8XiIijQ7z2dhetMNMdeNXZhohLXw8mQ6KniCHgGtzfGHCyg==)

  cloud:
    gateway:
      # 设置与服务注册发现组件结合，这样可以采用服务名的路由策略
      discovery:
        locator:
          enabled: true
      routes:
        # 配置路由规则
        - id: auth #payment_route    #路由的ID，没有固定规则但要求唯一，建议配合服务名
          uri: lb://blog-auth #匹配后提供服务的路由地址
          predicates:
            - Path=/auth/**         # 断言，路径相匹配的进行路由

        - id: content
          uri: lb://blog-content
          predicates:
            - Path=/content/**

        - id: file
          uri: lb://blog-file
          predicates:
            - Path=/file/**

rocketmq:
  name-server: 172.18.0.8:9876 # 访问地址
  producer:
    group: gateway # 必须指定group
    send-message-timeout: 3000 # 消息发送超时时长，默认3s
    retry-times-when-send-failed: 3 # 同步发送消息失败重试次数，默认2
    retry-times-when-send-async-failed: 3 # 异步发送消息失败重试次数，默认2
  consumer:
    groupName: gateway
    namesrvAddr: 172.18.0.8:9876 # mq的nameserver地址
    #该消费者订阅的主题和tags("*"号表示订阅该主题下所有的tags),格式：topic~tag1||tag2||tag3;topic2~*;
    topics: BLOG_USER_DATA~*;BLOG_SYSTEM_DATA~*;
    consumeThreadMin: 20
    consumeThreadMax: 64
    #设置一次消费消息的条数，默认为1条
    consumeMessageBatchMaxSize: 1

