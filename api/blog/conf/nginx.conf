
#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;
    client_max_body_size 500M;                    #上传文件大小限制
    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;


    server {
        listen       80;
        server_name  127.0.0.1;

        charset utf-8;

        #access_log  logs/host.access.log  main;
		
		# Allow special characters in headers
		ignore_invalid_headers off;
		# Allow any size file to be uploaded.
		# Set to a value such as 1000m; to restrict file size to a specific value
		client_max_body_size 0;
		# Disable buffering
		proxy_buffering off;
		proxy_request_buffering off;
		
		location / {
            root   /opt/docker/nginx/html;
            index  index.html index.htm;
	        try_files $uri $uri/ /index.html;

            client_max_body_size 500M;                    #上传文件大小限制
        }

        location /api/ {
            proxy_pass http://172.18.0.13:60001/;

            client_max_body_size 500M;                    #上传文件大小限制
            proxy_set_header Host $host;                   # 关键！覆盖 Host 为公网 IP
            proxy_set_header X-Forwarded-Proto $scheme;    # 传递协议（http/https）
            proxy_set_header X-Forwarded-Host $host;       # 传递客户端访问的域名/IP
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_redirect http://172.18.0.13:60002/ http://$host/api/;
        }

        location ^~ /socket/ {
            proxy_pass http://172.18.0.13:60001/;  # 转发地址
        }

		location /files/ {
			# 保留原始编码（如 %3A 不转义为冒号）
			rewrite ^/files/(.*) /$1 break;
			proxy_pass http://172.18.0.11:9000/;  # 末尾无斜杠
			
			proxy_set_header  X-Real-IP    $remote_addr;
			proxy_set_header  X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_http_version 1.1;
			proxy_set_header Connection "";
			chunked_transfer_encoding off;
			proxy_intercept_errors on;
			proxy_connect_timeout 300;
			proxy_redirect off;
			expires 7d;
			add_header XCDN-Cache "$upstream_cache_status";
		}
		
		location /minio/ui/ {
			rewrite ^/minio/ui/(.*) /$1 break;
			proxy_set_header Host $http_host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_set_header X-NginX-Proxy true;

			# This is necessary to pass the correct IP to be hashed
			real_ip_header X-Real-IP;

			proxy_connect_timeout 300;

			# To support websockets in MinIO versions released after January 2023
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			# Some environments may encounter CORS errors (Kubernetes + Nginx Ingress)
			# Uncomment the following line to set the Origin request to an empty string
			# proxy_set_header Origin '';
		
			chunked_transfer_encoding off;
		
			proxy_pass http://172.18.0.11:9001/minio/ui/; # This uses the upstream directive definition to load balance
		}

        # 匹配 /xxlJob/ui 路径的请求
        location /xxl-job-admin {
            # 直接代理到后端服务（不需要路径重写）
            proxy_pass http://172.18.0.12:8080;

            # 设置代理头部
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
   


        #error_page  404              /404.html;

        # redirect server error pages to the static page /50x.html
        #
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }

        # proxy the PHP scripts to Apache listening on 127.0.0.1:80
        #
        #location ~ \.php$ {
        #    proxy_pass   http://127.0.0.1;
        #}

        # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
        #
        #location ~ \.php$ {
        #    root           html;
        #    fastcgi_pass   127.0.0.1:9000;
        #    fastcgi_index  index.php;
        #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
        #    include        fastcgi_params;
        #}

        # deny access to .htaccess files, if Apache's document root
        # concurs with nginx's one
        #
        #location ~ /\.ht {
        #    deny  all;
        #}
    }


    # another virtual host using mix of IP-, name-, and port-based configuration
    #
    #server {
    #    listen       8000;
    #    listen       somename:8080;
    #    server_name  somename  alias  another.alias;

    #    location / {
    #        root   html;
    #        index  index.html index.htm;
    #    }
    #}


    # HTTPS server
    #
    #server {
    #    listen       443 ssl;
    #    server_name  localhost;

    #    ssl_certificate      cert.pem;
    #    ssl_certificate_key  cert.key;

    #    ssl_session_cache    shared:SSL:1m;
    #    ssl_session_timeout  5m;

    #    ssl_ciphers  HIGH:!aNULL:!MD5;
    #    ssl_prefer_server_ciphers  on;

    #    location / {
    #        root   html;
    #        index  index.html index.htm;
    #    }
    #}

}
