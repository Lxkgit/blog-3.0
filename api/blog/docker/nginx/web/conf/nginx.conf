worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    client_max_body_size 500M;

    server {
        listen 80;
        server_name _;

        charset utf-8;

        # =========================
        # 博客前端
        # =========================

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;

            try_files $uri $uri/ /index.html;

            client_max_body_size 500M;
        }

        # =========================
        # Auth
        # =========================

        location /auth/ {
            proxy_pass http://172.18.0.21:60001;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            client_max_body_size 500M;
        }

        # =========================
        # API
        # =========================

        location /api/ {
            proxy_pass http://172.18.0.21:60001/;

            client_max_body_size 500M;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_redirect http://172.18.0.22:60002/ http://$host/api/;
        }

        # =========================
        # Socket
        # =========================

        location ^~ /socket/ {
            proxy_pass http://172.18.0.21:60001/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # =========================================================
        # 视频流
        #
        # 浏览器：
        # /rtsp/cam1/?token=xxxxxxxx
        #
        # Nginx：
        # 1. 先调用 Java 验证 Token
        # 2. 验证成功后代理到 MediaMTX
        # =========================================================
        location ^~ /rtsp/ {

            # Token 鉴权
            auth_request /video-auth;

            auth_request_set $video_token $arg_token;

            proxy_pass http://172.18.0.14:8889/;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }


        # =========================================================
        # 视频 Token 鉴权
        #
        # 只能被 Nginx 内部调用
        # 浏览器无法直接访问
        # =========================================================
        location = /video-auth {

            internal;

            proxy_pass http://172.18.0.21:60001/file/camera/token/validate?token=$video_token;

            proxy_pass_request_body off;
            proxy_set_header Content-Length "";

            proxy_set_header Host $host;

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}