worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    client_max_body_size 500M;

    server {
        listen 80;
        server_name _;

        charset utf-8;

        # =========================
        # 博客前端
        # =========================

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;

            try_files $uri $uri/ /index.html;

            client_max_body_size 500M;
        }

        # =========================
        # Auth
        # =========================

        location /auth/ {
            proxy_pass http://172.18.0.21:60001;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            client_max_body_size 500M;
        }

        # =========================
        # API
        # =========================

        location /api/ {
            proxy_pass http://172.18.0.21:60001/;

            client_max_body_size 500M;

            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_redirect http://172.18.0.22:60002/ http://$host/api/;
        }

        # =========================
        # Socket
        # =========================

        location ^~ /socket/ {
            proxy_pass http://172.18.0.21:60001/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # =========================================================
        # 视频流 Token 鉴权
        #
        # 浏览器：
        # /rtsp/cam1/?token=xxxxxxxx
        #
        # 流程：
        # 1. auth_request 调用 /video-auth
        # 2. /video-auth 将 token 转给 Java
        # 3. Java 返回 2xx -> 放行
        # 4. Java 返回 401 -> 视频请求返回 401
        # 5. 鉴权成功后代理到 MediaMTX
        # =========================================================

        location ^~ /rtsp/ {

            auth_request /video-auth;
        
            proxy_pass http://172.18.0.14:8889/;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }


        # =========================================================
        # 视频 Token 鉴权
        # =========================================================

        location = /video-auth {

            internal;

            proxy_pass http://172.18.0.21:60001/file/camera/token/validate;

            proxy_pass_request_body off;
            proxy_set_header Content-Length "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 把原始请求的 token 传给 Java
            proxy_set_header X-Video-Token $arg_token;
        }

        # =========================================================
        # WebRTC WHEP 会话请求
        #
        # 支持：
        # /cam1/whep/{session-id}
        # /cam2/whep/{session-id}
        # /cam3/whep/{session-id}
        # /cam4/whep/{session-id}
        # ...
        # =========================================================

        location ~ ^/([^/]+)/whep/ {

            auth_request /video-auth;

            proxy_pass http://172.18.0.14:8889;

            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}