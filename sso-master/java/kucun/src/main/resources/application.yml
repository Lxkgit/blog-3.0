server:
  port: 8087
spring:
  application:
    name: kucun
  security:
    oauth2:
      client:
        #注册客户端
        registration:
          #注册名称 随便起
          kucun-oauth2:
            #客户端id 在授权服务器注册好的客户端
            client-id: kucun
            #客户端秘钥
            client-secret: 123456
            #供应商 要对应下面的供应商一致的名字
            provider: kucun-provider
            #授权类型 为授权码模式
            authorization-grant-type: authorization_code
            # 访问下面的回调路径 会自动带着登录之后的授权码
            redirect_uri: http://localhost:3002/callback
            #作用域 授权 复选框那个
            scope:
              - openid
        #供应商
        provider:
          #供应商的名称 要和注册哪里的供应商名称一致
          kucun-provider:
            #访问授权服务器 在OIDC中是一个非常重要的标识符，有助于标识身份提供者和验证ID Token
            issuer-uri: http://auth-server:8084
